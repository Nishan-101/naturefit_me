<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Staff | Nature Fit Restaurant</title>
<link rel="stylesheet" href="css/style.css?v=15">
<link rel="stylesheet" href="css/platform.css?v=16">
</head>
<body>
<header class="site-header" id="siteHeader">
  <div class="container header-inner">
    <a href="index.html" class="brand"><img src="images/logo.png?v=4" alt="Nature Fit Restaurant logo" class="brand-logo"></a>
    <button type="button" class="btn btn-outline btn-small" id="adminLogout">Log out</button>
  </div>
</header>
<main class="dash-wrap">
  <p class="app-status" id="adminStatus" role="status"></p>
  <section class="dash-card" id="adminLogin">
    <h1>Staff dashboard</h1>
    <form id="staffForm">
      <div class="form-group"><label for="adminPassword">Staff password</label><input id="adminPassword" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-forest" type="submit">Open dashboard</button>
    </form>
  </section>
  <section class="dash-card" id="adminApp" hidden>
    <div class="tabs" id="tabs"></div>
    <div id="panel"></div>
  </section>
</main>
<script src="js/platform.js?v=15"></script>
<script src="js/admin.js?v=18"></script>
</body>
</html>
